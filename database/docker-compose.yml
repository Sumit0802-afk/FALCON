services:
  mysql:
    image: mysql:8.4
    container_name: falcon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-falcon}
      MYSQL_USER: ${MYSQL_USER:-falcon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-falcon}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - falcon_mysql_data:/var/lib/mysql
      # Only run automatically on a brand-new (empty) data volume, in filename order.
      - ./init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./init/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: falcon-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  falcon_mysql_data:
