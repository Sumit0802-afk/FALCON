# PostgreSQL for local development. Falcon's tables are made by the Prisma migrations:
#   cd falcon-backend/backend && npx prisma migrate deploy
#
# The password must be set (copy .env.example to .env and choose one), and the database
# listens on this computer only, not on the network.
services:
  postgres:
    image: postgres:16
    container_name: falcon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-falcon}
      POSTGRES_USER: ${POSTGRES_USER:-falcon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in database/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - falcon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-falcon} -d ${POSTGRES_DB:-falcon}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  falcon_postgres_data:
